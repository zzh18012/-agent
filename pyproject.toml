[project]
name = "mmos"
version = "0.1.0"
description = "MathModelingOS — an evidence-driven mathematical modeling automation system"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "MathModelingOS contributors" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "pydantic-ai-slim[openai]>=2.68.0",
    "polars>=2.1.0",
    "pandera>=0.36.0",
    "scikit-learn>=1.9.1",
    "snakemake>=9.27.1",
    "mlflow>=3.18.0",
    "matplotlib>=3.11.2",
    "ortools>=9.15.6755",
    "simpy>=4.1.2",
    "networkx>=3.7",
    "pymupdf>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
mmos = "mmos.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmos"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: requires external services or credentials"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
